[project]
name = "a2a-system"
version = "0.1.0"
description = "Sprout: a friendly host agent that delegates to specialist agents over hand-rolled A2A v1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150",
    "uvicorn>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx2>=2.15",
    "openai>=3.0",
    "redis>=6.0",
    "mcp>=2.0",
    "ddgs>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "fakeredis>=2.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
